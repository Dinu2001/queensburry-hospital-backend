<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Patient Registration Successful</title>
</head>
<body style="font-family: Arial; background: #f7f7f7; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 6px;">
    <h2 style="color:#0b74de;">{{clinicName}}</h2>

    <p>Hello <strong>{{patientName}}</strong>,</p>

    <p>Your registration has been successfully completed.</p>

    <p><strong>Patient ID:</strong> {{patientId}}</p>
    <p><strong>Registered On:</strong> {{registrationDate}}</p>



    <hr />

    <p style="font-size:12px;color:#777;">
        © {{year}} {{clinicName}} — All Rights Reserved.
    </p>
</div>
</body>
</html>
